# 区域マップ：地番の地図（chiban/）を作り直す
# ・tools/chiban-sources.txt を書きかえてコミットすると動きます（「Actions」→「地番の地図」→「Run workflow」でも動きます）
# ・AIGID が公開している GeoJSON（法務省の登記所備付地図を変換したもの・CC BY）をダウンロードして、tools/moj-chiban.py で表にします
# ・結果は chiban-update ブランチに入ります。中身を確かめてから main にまぜてください（本番の画面にすぐは出ません）
name: 地番の地図

on:
  push:
    branches: [main]
    paths:
      - tools/chiban-sources.txt
      - .github/workflows/chiban.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chiban
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 道具を入れる
        run: pip install -q pyproj shapely

      - name: GeoJSON をダウンロードして表にする
        run: |
          mkdir -p dl
          LOG=chiban/_log.txt
          mkdir -p chiban
          : > "$LOG"
          ok=1
          while read -r code asof url; do
            case "$code" in ''|\#*) continue;; esac
            echo "ダウンロード：$code（$asof）" | tee -a "$LOG"
            mkdir -p "dl/$code"
            if ! curl -fsSL --retry 3 -o "dl/$code/$code.geojson" "$url" 2>>"$LOG"; then echo "ダウンロードできませんでした" | tee -a "$LOG"; ok=0; continue; fi
            ls -la "dl/$code" | tee -a "$LOG"
            python3 -c "import json,sys; j=json.load(open(sys.argv[1])); f=j['features']; print('件数', len(f)); print(json.dumps(f[0]['properties'], ensure_ascii=False)); print(f[0]['geometry']['type'], str(f[0]['geometry']['coordinates'])[:200])" "dl/$code/$code.geojson" 2>&1 | tee -a "$LOG"
            rm -rf "chiban/$code"
            if ! python3 tools/moj-chiban.py "dl/$code" chiban "$asof" 2>&1 | grep -v '^読みました' | tee -a "$LOG"; then ok=0; fi
            [ "${PIPESTATUS[0]}" = "0" ] || ok=0
          done < tools/chiban-sources.txt
          du -sh chiban | tee -a "$LOG"
          cat chiban/index.json | tee -a "$LOG" || true
          echo "ok=$ok" | tee -a "$LOG"

      - name: chiban-update ブランチに入れる
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chiban-update
          git add -A chiban
          git commit -m "地番の地図を作り直す（tools/chiban-sources.txt から）。結果は chiban/_log.txt" || echo "変わったところはありません"
          git push -f origin chiban-update

# 区域マップ：紙の予備（S-12・S-13 の PDF）を、毎週Googleドライブに保存する
# ・毎週 火曜の夜中（水曜の午前2時ごろ・日本時間）に動きます。GitHub が混んでいると少し遅れます
# ・「Actions」→「紙の予備（S-12・S-13）」→「Run workflow」で、手で動かすこともできます
# ・失敗したときは、GitHub からリポジトリの持ち主にメールが届きます
name: 紙の予備（S-12・S-13）

on:
  schedule:
    - cron: '0 17 * * 2'   # 世界標準時の火曜17時 ＝ 日本時間の水曜2時
  workflow_dispatch:
    inputs:
      force:
        description: 'すべての区域を作り直す'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kami-yobi
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 日本語の文字を入れる
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 見えないブラウザを用意する
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: PDF を作ってドライブへ送る
        env:
          KUIKI_PAGE: ${{ vars.KUIKI_PAGE || 'https://tomishirokharea.github.io/kuiki-map/kuiki-map-test/' }}
          KUIKI_TOKEN: ${{ secrets.KUIKI_ROBOT_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: node tools/kami-yobi.mjs
